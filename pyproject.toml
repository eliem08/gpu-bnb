[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-bnb"
version = "0.1.0"
description = "Airbnb for idle GPUs: rent out computing power you are not using"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
gpu-bnb = "gpu_bnb.__main__:main"

[tool.setuptools]
packages = ["gpu_bnb"]
